plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.sothuchi.moi'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.sothuchi.moi'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

